{% extends 'citas/base.html' %}
{% block title %}Página no encontrada (404){% endblock %}
{% block content %}

    <p class="fs-4">😕 No encontramos la página que buscas.</p>

    <a href="{% url 'citas:home' %}" class="btn btn-primary">Volver al inicio</a>

</div>
{% endblock %}
